name: Update SNU meal snapshot

on:
  schedule:
    # 06:30 Seoul time (21:30 UTC the day before), once a day.
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-meals
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      # Writes meals.json only after the whole window was collected; on failure the previous file stays.
      - run: python scripts/build_snapshot.py meals.json
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add meals.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh SNU meal snapshot"
          git push
